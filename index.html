<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataformero ahora es NIMBO</title>
<link rel="canonical" href="https://fnguerrero.github.io/nimbo/">
<meta http-equiv="refresh" content="2; url=https://fnguerrero.github.io/nimbo/">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d0b1a;
    color: #cfc9e8;
    font-family: "Consolas", "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .caja { padding: 24px; }
  h1 { font-size: 34px; margin: 0 0 6px; color: #ffd23f; letter-spacing: 2px; }
  p { font-size: 14px; line-height: 1.7; opacity: 0.85; margin: 6px 0; }
  a { color: #ffd23f; }
  .chico { font-size: 12px; opacity: 0.6; margin-top: 18px; }
</style>
</head>
<body>
  <div class="caja">
    <h1>NIMBO</h1>
    <p>Plataformero cambió de nombre.</p>
    <p>Te estamos llevando a <a href="https://fnguerrero.github.io/nimbo/">fnguerrero.github.io/nimbo</a></p>
    <p class="chico">Si no pasa nada en un par de segundos, tocá el enlace.</p>
  </div>
  <script>
    // El meta refresh alcanza, pero esto evita dejar la página vieja en el
    // historial: al volver atrás no te trae de nuevo acá.
    location.replace('https://fnguerrero.github.io/nimbo/');
  </script>
</body>
</html>
